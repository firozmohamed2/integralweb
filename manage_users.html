<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users - Integral Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
        background-color: #f8fafc;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .online-indicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        background-color: #22c55e;
        border-radius: 50%;
        margin-right: 6px;
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
        }
        70% {
          box-shadow: 0 0 0 6px rgba(34, 197, 94, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
        }
      }
    </style>
  </head>
  <body class="text-slate-800 antialiased">
    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-8">
      <!-- Header -->
      <header
        class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4"
      >
        <div>
          <h1
            class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2"
          >
            <i data-lucide="users" class="text-blue-600"></i>
            User Management
          </h1>
          <p class="text-slate-500 text-sm mt-1" id="authStatus">
            Initializing...
          </p>
        </div>
        <div class="w-full md:w-auto">
          <div class="relative">
            <i
              data-lucide="search"
              class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"
            ></i>
            <input
              type="text"
              id="searchInput"
              placeholder="Search users by name..."
              class="pl-10 pr-4 py-2.5 w-full md:w-80 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm"
            />
          </div>
        </div>
      </header>

      <!-- Loading State -->
      <div
        id="loadingState"
        class="flex flex-col items-center justify-center py-20"
      >
        <div
          class="w-10 h-10 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin mb-4"
        ></div>
        <p class="text-slate-500 font-medium">Fetching users...</p>
      </div>

      <!-- Content Grid -->
      <div
        id="contentGrid"
        class="grid grid-cols-1 lg:grid-cols-2 gap-8 hidden"
      >
        <!-- Paid Users Column -->
        <div class="flex flex-col h-[calc(100vh-200px)]">
          <div
            class="bg-green-50 border border-green-100 p-4 rounded-t-xl flex items-center justify-between"
          >
            <h2
              class="text-lg font-bold text-green-800 flex items-center gap-2"
            >
              <i data-lucide="check-circle" class="w-5 h-5"></i>
              Paid Users
            </h2>
            <span
              id="paidCount"
              class="bg-white text-green-700 px-3 py-1 rounded-full text-xs font-bold shadow-sm"
              >0</span
            >
          </div>
          <div
            class="bg-white border border-slate-200 border-t-0 rounded-b-xl flex-grow overflow-hidden flex flex-col shadow-sm"
          >
            <div
              id="paidUsersList"
              class="overflow-y-auto p-4 space-y-3 custom-scrollbar flex-grow"
            >
              <!-- Paid Users injected here -->
            </div>
          </div>
        </div>

        <!-- Trial/Free Users Column -->
        <div class="flex flex-col h-[calc(100vh-200px)]">
          <div
            class="bg-slate-50 border border-slate-200 p-4 rounded-t-xl flex items-center justify-between"
          >
            <h2
              class="text-lg font-bold text-slate-700 flex items-center gap-2"
            >
              <i data-lucide="clock" class="w-5 h-5"></i>
              Trial / Free Users
            </h2>
            <span
              id="trialCount"
              class="bg-white text-slate-700 px-3 py-1 rounded-full text-xs font-bold shadow-sm"
              >0</span
            >
          </div>
          <div
            class="bg-white border border-slate-200 border-t-0 rounded-b-xl flex-grow overflow-hidden flex flex-col shadow-sm"
          >
            <div
              id="trialUsersList"
              class="overflow-y-auto p-4 space-y-3 custom-scrollbar flex-grow"
            >
              <!-- Trial Users injected here -->
            </div>
          </div>
        </div>
      </div>

      <!-- Empty Search State (Hidden by default) -->
      <div id="noResults" class="hidden text-center py-20">
        <div
          class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4"
        >
          <i data-lucide="search-x" class="text-slate-300 w-8 h-8"></i>
        </div>
        <h3 class="text-lg font-semibold text-slate-900">No users found</h3>
        <p class="text-slate-500">Try adjusting your search terms.</p>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
      import {
        getAuth,
        signInAnonymously,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
      import {
        getFirestore,
        collection,
        getDocs,
        doc,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDNqfRczOHTukGdXDnuzVXjbL7P5blnyAo",
        authDomain: "dbydx-ea226.firebaseapp.com",
        projectId: "dbydx-ea226",
        storageBucket: "dbydx-ea226.firebasestorage.app",
        messagingSenderId: "329650707379",
        appId: "1:329650707379:web:18bab2bab403e1004b89c6",
        measurementId: "G-2F7YVE2X94",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let allUsers = []; // Store all fetched users

      // Initialize Auth
      onAuthStateChanged(auth, (user) => {
        const statusEl = document.getElementById("authStatus");
        if (user) {
          statusEl.innerHTML = `<span class="flex items-center gap-1.5"><span class="w-2 h-2 bg-green-500 rounded-full"></span> Connected</span>`;
          fetchUsers();
        } else {
          statusEl.textContent = "Connecting...";
          signInAnonymously(auth).catch((err) => {
            console.error("Auth Error:", err);
            statusEl.textContent = "Connection Failed";
          });
        }
      });

      async function fetchUsers() {
        try {
          const querySnapshot = await getDocs(collection(db, "integralUsers"));
          allUsers = [];

          querySnapshot.forEach((doc) => {
            allUsers.push({ id: doc.id, ...doc.data() });
          });

          renderUsers(allUsers);

          document.getElementById("loadingState").classList.add("hidden");
          document.getElementById("contentGrid").classList.remove("hidden");
          document.getElementById("contentGrid").classList.add("grid");
        } catch (error) {
          console.error("Error fetching users:", error);
          alert("Failed to load user data. Check console for details.");
        }
      }

      function renderUsers(users) {
        const paidContainer = document.getElementById("paidUsersList");
        const trialContainer = document.getElementById("trialUsersList");
        const paidCountEl = document.getElementById("paidCount");
        const trialCountEl = document.getElementById("trialCount");
        const noResultsEl = document.getElementById("noResults");
        const contentGrid = document.getElementById("contentGrid");

        paidContainer.innerHTML = "";
        trialContainer.innerHTML = "";

        if (users.length === 0) {
          contentGrid.classList.add("hidden");
          noResultsEl.classList.remove("hidden");
          return;
        } else {
          contentGrid.classList.remove("hidden");
          noResultsEl.classList.add("hidden");
        }

        let paidCount = 0;
        let trialCount = 0;

        users.forEach((user) => {
          const card = createUserCard(user);

          // Check subscription status (case-insensitive)
          const status = (user.subscriptionStatus || "").toLowerCase();

          if (status === "paid") {
            paidContainer.appendChild(card);
            paidCount++;
          } else {
            trialContainer.appendChild(card);
            trialCount++;
          }
        });

        paidCountEl.textContent = paidCount;
        trialCountEl.textContent = trialCount;
        lucide.createIcons();
      }

      window.updateTrialDate = async (userId, inputElement) => {
        const newDate = inputElement.value;
        if (!newDate) return;

        const timestamp = new Date(newDate).getTime();
        const btn = inputElement.nextElementSibling;

        try {
          btn.textContent = "Saving...";
          btn.disabled = true;

          await updateDoc(doc(db, "integralUsers", userId), {
            trialEndDate: timestamp,
          });

          btn.textContent = "Saved!";
          btn.classList.remove("bg-blue-600", "hover:bg-blue-700");
          btn.classList.add("bg-green-600", "hover:bg-green-700");

          setTimeout(() => {
            btn.textContent = "Update";
            btn.disabled = false;
            btn.classList.remove("bg-green-600", "hover:bg-green-700");
            btn.classList.add("bg-blue-600", "hover:bg-blue-700");
          }, 2000);

          // Update local state
          const user = allUsers.find((u) => u.id === userId);
          if (user) user.trialEndDate = timestamp;
        } catch (error) {
          console.error("Error updating date:", error);
          alert("Failed to update date.");
          btn.textContent = "Retry";
          btn.disabled = false;
        }
      };

      function formatDuration(seconds) {
        if (!seconds) return "0s";
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        return `${h.toString().padStart(2, "0")}:${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
      }

      function formatTimeAgo(timestamp) {
        if (!timestamp) return "N/A";
        const now = Date.now();
        const diff = now - timestamp;
        const minutes = Math.floor(diff / 60000);
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);

        if (minutes < 1) return "Just now";
        if (minutes < 60) return `${minutes}m ago`;
        if (hours < 24) return `${hours}h ago`;
        return `${days}d ago`;
      }

      function formatLastActive(timestamp) {
        if (!timestamp) return "N/A";
        const date = new Date(timestamp);
        return date.toLocaleString("en-US", {
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
        });
      }

      function getActivityLabel(type) {
        if (!type) return "Inactive";
        if (type.includes("watching_video_paused")) return "Paused Video";
        if (type.includes("watching_video")) return "Watching Video";
        if (type.includes("browsing")) return "Browsing App";
        return type.replace(/_/g, " ");
      }

      function createUserCard(user) {
        const div = document.createElement("div");
        div.className =
          "p-4 rounded-lg border border-slate-100 hover:border-blue-200 hover:bg-slate-50 transition-all group relative bg-white shadow-sm";

        // 1. Profile Information
        const name = user.name || "Unknown Name";
        const email = user.email || "No Email";
        const mobile = user.mobile || user.phoneNumber || "N/A";
        const className = user.class || "N/A";
        const avatar = user.avatar || "default";
        const status = (user.subscriptionStatus || "Trial").toLowerCase();

        // 2. Engagement Metrics
        const lastActive = user.lastActiveTimestamp || 0;
        const isOnline = Date.now() - lastActive < 5 * 60 * 1000; // 5 minutes
        const totalUsage = formatDuration(user.totalActiveTimeSeconds || 0);
        const activityType = user.lastActivityType || "";
        const activityLabel = getActivityLabel(activityType);

        // 3. Content Context
        const showContentContext = activityType.includes("video");
        const currentChapter = user.currentChapter || "N/A";
        const currentTopic = user.currentTopic || "N/A";

        // Avatar Handling (using a placeholder or specific icon logic if needed)
        // Assuming simple text avatar if no image URL
        const avatarHtml = `<div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 font-bold text-lg">${name.charAt(0).toUpperCase()}</div>`;

        // Status Badge Logic
        const statusBadge = `
                <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded ${
                  status === "paid"
                    ? "bg-green-100 text-green-700 border border-green-200"
                    : "bg-amber-50 text-amber-600 border border-amber-200"
                }">${status}</span>`;

        // Online Indicator
        const onlineStatusHtml = isOnline
          ? `<div class="flex items-center text-xs font-medium text-green-600 mb-1"><span class="online-indicator"></span>Online</div>`
          : `<div class="text-xs text-slate-400 mb-1">Last seen: ${formatTimeAgo(lastActive)}</div>`;

        div.innerHTML = `
                <div class="flex gap-3 mb-3">
                    ${avatarHtml}
                    <div class="flex-grow min-w-0">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-slate-800 text-base truncate pr-2 leading-tight" title="${name}">${name}</h3>
                                <div class="text-xs text-slate-500 mt-0.5">${className} • ${mobile}</div>
                            </div>
                            ${statusBadge}
                        </div>
                    </div>
                </div>

                <div class="space-y-2 mb-3">
                    <div class="bg-slate-50 rounded p-2 border border-slate-100">
                        ${onlineStatusHtml}
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-500">Activity:</span>
                            <span class="font-medium text-slate-700 ${isOnline ? "text-blue-600" : ""}">${activityLabel}</span>
                        </div>
                        <div class="flex justify-between items-center text-xs mt-1">
                            <span class="text-slate-500">Total Usage:</span>
                            <span class="font-mono font-medium text-slate-700">${totalUsage}</span>
                        </div>
                         <div class="flex justify-between items-center text-xs mt-1 border-t border-slate-200 pt-1">
                            <span class="text-slate-500">Last Active:</span>
                            <span class="text-slate-700">${formatLastActive(lastActive)}</span>
                        </div>
                    </div>

                    ${
                      showContentContext
                        ? `
                    <div class="bg-blue-50 rounded p-2 border border-blue-100">
                        <div class="text-[10px] font-bold text-blue-400 uppercase tracking-wide mb-1">Now Watching</div>
                        <div class="text-xs font-semibold text-slate-800 truncate" title="${currentTopic}">${currentTopic}</div>
                        <div class="text-xs text-slate-500 truncate" title="${currentChapter}">${currentChapter}</div>
                    </div>
                    `
                        : ""
                    }
                </div>

                <div class="flex items-center gap-2 text-xs text-slate-400 border-t border-slate-100 pt-2 mb-2">
                    <i data-lucide="mail" class="w-3 h-3"></i>
                    <span class="truncate" title="${email}">${email}</span>
                </div>
            `;

        // Format Trial Date if exists (Only for non-paid)
        if (status !== "paid") {
          // ... (Existing trial date logic remains the same, just updating the visual container)
          // Re-using the logic but injecting it cleanly

          // Convert timestamp number to YYYY-MM-DDTHH:mm format for datetime-local input
          let dateValue = "";
          if (user.trialEndDate) {
            const d = new Date(Number(user.trialEndDate));
            if (!isNaN(d.getTime())) {
              const offset = d.getTimezoneOffset() * 60000;
              const localISOTime = new Date(d.getTime() - offset)
                .toISOString()
                .slice(0, 16);
              dateValue = localISOTime;
            }
          }

          const trialSection = document.createElement("div");
          trialSection.className = "mt-2 pt-2 border-t border-slate-100";
          trialSection.innerHTML = `
                     <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">Trial Expires On</label>
                     <div class="flex gap-2">
                         <input 
                             type="datetime-local" 
                             value="${dateValue}"
                             class="flex-grow px-2 py-1 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none h-7 bg-white"
                         >
                         <button 
                             onclick="updateTrialDate('${user.id}', this.previousElementSibling)"
                             class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2 rounded font-medium transition-colors h-7 flex items-center"
                         >
                             Save
                         </button>
                     </div>
                `;
          div.appendChild(trialSection);
        }

        // ID footer
        const footer = document.createElement("div");
        footer.className =
          "mt-2 pt-2 border-t border-slate-100 flex justify-between items-center";
        footer.innerHTML = `<span class="text-[10px] text-slate-300 font-mono truncate max-w-[150px] select-all">${user.id}</span>`;
        div.appendChild(footer);

        return div;
      }

      // Search Functionality
      document.getElementById("searchInput").addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        const filteredUsers = allUsers.filter((user) => {
          const name = (user.name || "").toLowerCase();
          const email = (user.email || "").toLowerCase();
          return name.includes(term) || email.includes(term);
        });
        renderUsers(filteredUsers);
      });

      lucide.createIcons();
    </script>
  </body>
</html>
